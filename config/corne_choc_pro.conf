# Applies to both halves. Board-level hardware settings stay in the defconfigs.

# Idle after five minutes, deep sleep after one hour of inactivity.
CONFIG_ZMK_IDLE_TIMEOUT=300000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# Turn underglow off while idle to save battery.
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
